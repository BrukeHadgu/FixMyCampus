<form class="filter-bar" role="search" (submit)="$event.preventDefault()">
  <label>
    <span>Search tickets</span>
    <input
      type="search"
      [value]="query"
      placeholder="Search by description or ticket number"
      (input)="updateQuery($any($event.target).value)"
    />
  </label>
  <label>
    <span>Status</span>
    <select [value]="status ?? ''" (change)="updateStatus($any($event.target).value)">
      <option value="">All statuses</option>
      @for (option of statuses; track option) {
        <option [value]="option">{{ getStatusLabel(option) }}</option>
      }
    </select>
  </label>
</form>
